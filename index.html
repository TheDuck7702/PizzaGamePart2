<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Jump</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
    
        <div id="score-board">
            Score: <span id="score">0</span> | High: <span id="high-score">0</span>
        </div>
       
        <canvas id="gameCanvas" width="420" height="640"></canvas>
        
        
        <div id="start-screen" class="overlay">
            <h1>PIZZA JUMP</h1>
            <p>Use <b>Left / Right</b> arrows or <b>A / D</b> to move.</p>
            <p>Jump on crust platforms, collect fresh pizzas (+1 pt), and avoid burnt pizzas!</p>
            <button onclick="startGame()">Press Space or Click to Start</button>
        </div>


        <div id="game-over" class="overlay">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
